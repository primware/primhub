<!doctype html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Primhub" />
  <meta name="google" content="notranslate" />
  <meta data-form-type="other" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="primhub" />
  <link rel="apple-touch-icon" href="icons/LogoPrimHub.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2" />
  <link rel="icon" type="image/png" href="favicon_primhub.png" />

  <title>primhub</title>
</head>

<body>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f4f6f8;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .loader-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(75, 66, 118, 0.15);
      background-color: white;
      padding: 15px;
      box-sizing: border-box;
      object-fit: contain;
    }

    .loader-title {
      color: #4b4276;
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: 0.5px;
    }

    .loader-subtitle {
      color: #7b7596;
      font-size: 16px;
      margin: 0;
      display: flex;
      align-items: center;
      font-weight: 500;
    }

    .loading-dots {
      display: inline-block;
      width: 20px;
      text-align: left;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin-top: 32px;
      border: 4px solid rgba(75, 66, 118, 0.1);
      border-radius: 50%;
      border-top-color: #4b4276;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(75, 66, 118, 0.2);
      }

      70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 15px rgba(75, 66, 118, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(75, 66, 118, 0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes dots {

      0%,
      20% {
        content: '';
      }

      40% {
        content: '.';
      }

      60% {
        content: '..';
      }

      80%,
      100% {
        content: '...';
      }
    }
  </style>

  <div id="loading">
    <h1 class="loader-title">PrimHub</h1>
    <p class="loader-subtitle">Cargando<span class="loading-dots"></span></p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      const loader = document.getElementById("loading");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(() => {
          loader.style.visibility = "hidden";
          loader.style.display = "none";
        }, 500);
      }
    });
  </script>
</body>

</html>
